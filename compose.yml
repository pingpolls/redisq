name: redisq
services:
  redis:
    image: "redis:alpine"
    restart: always
    expose:
      - 6379
    volumes:
      - "redisvol:/data"
      - ./redis.conf:/etc/sysctl.d/99-redis.conf
    networks:
      - redis-net
    ports:
      - 6379:6379
volumes:
  redisvol:
    driver: local
networks:
  redis-net:
    driver: bridge
